  <path d="M192 228 L180 240 L192 252 M241 228 L253 240 L241 252 M224 222 L208 258" fill="none" stroke="#29718C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="205" y="266" width="52" height="21" rx="5" fill="#E0EDF2"/>
  <text x="231" y="282" text-anchor="middle" class="tiny mono" font-weight="700" fill="#29718C">APK</text>
  <text x="219" y="327" text-anchor="middle" class="cardtitle" fill="#315B6F">原始安卓应用</text>

  <path d="M219 341 V374" fill="none" stroke="#718A97" stroke-width="2.5"/>
  <path d="M213 367 L219 376 L225 367" fill="none" stroke="#718A97" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="72" y="383" width="290" height="61" rx="12" fill="#E8F1F4" stroke="#92B1BE" stroke-width="1.5"/>
  <text x="217" y="407" text-anchor="middle" class="small" fill="#315B6F">静态解析工具</text>
  <text x="217" y="430" text-anchor="middle" class="body mono" font-weight="700" fill="#315B6F">Androguard · AnalyzeAPK</text>

  <path d="M219 444 V468" fill="none" stroke="#718A97" stroke-width="2.5"/>
  <path d="M213 461 L219 470 L225 461" fill="none" stroke="#718A97" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="69" y="477" width="302" height="76" rx="11" fill="#FFFFFF" stroke="#B5CBD5" stroke-width="1.5"/>
  <text x="88" y="507" class="body mono" font-weight="700">AndroidManifest.xml</text>
  <text x="88" y="536" class="small" fill="#627784">权限、组件、Intent 声明</text>
  <rect x="69" y="563" width="302" height="76" rx="11" fill="#FFFFFF" stroke="#B5CBD5" stroke-width="1.5"/>
  <text x="88" y="593" class="body mono" font-weight="700">classes*.dex</text>
  <text x="88" y="622" class="small" fill="#627784">方法引用、操作码、字符串</text>
  <text x="219" y="667" text-anchor="middle" class="small" fill="#607985">不运行应用，不采集动态行为</text>

  <!-- Manifest and DEX observations jointly feed the two extraction routes. -->
  <path d="M371 515 H425 M371 601 H425 M425 515 V601 M425 558 H449 M449 242 V558 M449 242 H485 M449 539 H485" fill="none" stroke="#5D7380" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M478 236 L487 242 L478 248" fill="none" stroke="#5D7380" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M478 533 L487 539 L478 545" fill="none" stroke="#5D7380" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="425" cy="558" r="5" fill="#5D7380"/>

