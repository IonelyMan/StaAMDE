<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="750" viewBox="0 0 1700 750" role="img" aria-label="APK 静态预处理及两条分类分支的明确输入">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #243442; }
      .title { font-size: 29px; font-weight: 700; }
      .section { font-size: 25px; font-weight: 700; }
      .cardtitle { font-size: 23px; font-weight: 700; }
      .body { font-size: 19px; }
      .small { font-size: 16px; }
      .tiny { font-size: 14px; }
      .mono { font-family: Consolas, "Microsoft YaHei", monospace; }
    </style>
  </defs>

  <rect width="1700" height="750" fill="#FFFFFF"/>
  <text x="47" y="52" class="title">阶段一：APK 静态预处理与双分支模型输入</text>
  <path d="M47 69 H1653" fill="none" stroke="#DBE4E8" stroke-width="2"/>

  <!-- Shared static source panel. -->
  <rect x="42" y="105" width="355" height="582" rx="20" fill="#F8FBFC" stroke="#9FB8C3" stroke-width="2"/>
  <text x="69" y="145" class="section" fill="#315B6F">APK 静态预处理</text>
  <path d="M69 161 H370" fill="none" stroke="#D2E0E6" stroke-width="1.5"/>

  <rect x="161" y="185" width="113" height="110" rx="12" fill="#FFFFFF" stroke="#29718C" stroke-width="3"/>
