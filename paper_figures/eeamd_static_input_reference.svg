<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-label="EEAMD 安卓 APK 静态解析与双分支输入示意图">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #213442; }
      .title { font-size: 27px; font-weight: 700; }
      .section { font-size: 25px; font-weight: 700; }
      .body { font-size: 20px; }
      .small { font-size: 17px; }
      .tiny { font-size: 15px; }
      .mono { font-family: Consolas, "Microsoft YaHei", monospace; }
      .line { fill: none; stroke: #536979; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.3" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L9 5 L1 9 Z" fill="#536979"/>
    </marker>
    <marker id="purple-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L8 4.5 L1 8 Z" fill="#8E4B91"/>
    </marker>
    <marker id="green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L8 4.5 L1 8 Z" fill="#4A8060"/>
    </marker>
  </defs>

  <rect width="1500" height="620" fill="#FFFFFF"/>
  <text x="47" y="49" class="title">APK 静态解析与双分支输入</text>
  <path d="M47 65 H1453" stroke="#DDE6EA" stroke-width="2"/>

  <!-- Input APK. -->
  <rect x="43" y="201" width="171" height="214" rx="17" fill="#F5FAFC" stroke="#A6C1CF" stroke-width="2"/>
  <rect x="91" y="234" width="73" height="83" rx="7" fill="#FFFFFF" stroke="#24617E" stroke-width="3"/>
  <path d="M144 234 V253 H164" fill="none" stroke="#24617E" stroke-width="3" stroke-linejoin="round"/>
  <path d="M109 274 L99 283 L109 292 M145 274 L155 283 L145 292 M134 270 L121 296" fill="none" stroke="#24617E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="128" y="354" text-anchor="middle" class="section" fill="#24617E">安卓 APK</text>
  <text x="128" y="384" text-anchor="middle" class="small" fill="#657C88">输入样本</text>

  <!-- Conceptual static parser, used by both extraction scripts. -->
  <rect x="276" y="99" width="414" height="430" rx="18" fill="#F8FBFC" stroke="#9CB6C2" stroke-width="2"/>
  <rect x="276" y="99" width="414" height="75" rx="18" fill="#EAF2F5"/>
  <rect x="276" y="155" width="414" height="19" fill="#EAF2F5"/>
  <text x="304" y="146" class="section" fill="#28536A">APK 静态解析</text>
  <rect x="304" y="187" width="358" height="38" rx="10" fill="#FFFFFF" stroke="#CADAE1" stroke-width="1.5"/>
  <text x="483" y="213" text-anchor="middle" class="small mono" fill="#406676">Androguard · AnalyzeAPK</text>

  <rect x="304" y="241" width="358" height="92" rx="12" fill="#FFFFFF" stroke="#CCDCE3" stroke-width="1.5"/>
  <rect x="304" y="241" width="8" height="92" rx="4" fill="#7AA7BA"/>
  <text x="329" y="277" class="body mono" font-weight="700">AndroidManifest.xml</text>
  <text x="329" y="311" class="small" fill="#596F79">权限、组件、Intent 声明</text>

  <rect x="304" y="347" width="358" height="105" rx="12" fill="#FFFFFF" stroke="#CCDCE3" stroke-width="1.5"/>
  <rect x="304" y="347" width="8" height="105" rx="4" fill="#7AA7BA"/>
  <text x="329" y="383" class="body mono" font-weight="700">classes*.dex</text>
  <text x="329" y="417" class="small" fill="#596F79">方法引用、API 调用、操作码</text>
  <text x="329" y="442" class="small" fill="#596F79">与字符串常量</text>

  <text x="483" y="498" text-anchor="middle" class="small" fill="#557180">仅解析文件，不执行应用</text>

  <!-- Connections. -->
  <path d="M214 308 H272" class="line" marker-end="url(#arrow)"/>
  <path d="M690 308 H748 M748 182 V445" class="line"/>
  <circle cx="748" cy="308" r="5" fill="#536979"/>
  <path d="M748 182 H807" class="line" marker-end="url(#arrow)"/>
  <path d="M748 445 H807" class="line" marker-end="url(#arrow)"/>

  <!-- Static feature branch. -->
  <rect x="810" y="82" width="645" height="218" rx="17" fill="#FCF8FC" stroke="#C89BC9" stroke-width="2"/>
  <rect x="833" y="105" width="42" height="42" rx="10" fill="#934E98"/>
  <text x="854" y="134" text-anchor="middle" font-size="23" font-weight="700" fill="#FFFFFF">1</text>
  <text x="892" y="135" class="section" fill="#633368">静态特征构建</text>
  <text x="1429" y="132" text-anchor="end" class="small" fill="#8E4B91">输出：特征向量</text>
  <path d="M833 159 H1432" stroke="#E7D5E8" stroke-width="1.5"/>
  <text x="835" y="189" class="body" fill="#3D3040">权限 · 组件 · Intent · API 调用</text>
  <text x="835" y="219" class="body" fill="#3D3040">操作码 · 命令及可疑字符串</text>
  <rect x="835" y="244" width="234" height="38" rx="10" fill="#FFFFFF" stroke="#BE92C0" stroke-width="1.5"/>
  <text x="952" y="270" text-anchor="middle" class="small" fill="#633368">二值 / 对数计数编码</text>
  <path d="M1075 263 H1111" stroke="#8E4B91" stroke-width="2" marker-end="url(#purple-arrow)"/>
  <rect x="1119" y="244" width="143" height="38" rx="10" fill="#FFFFFF" stroke="#BE92C0" stroke-width="1.5"/>
  <text x="1190" y="270" text-anchor="middle" class="small" fill="#633368">互信息筛选</text>
  <path d="M1268 263 H1304" stroke="#8E4B91" stroke-width="2" marker-end="url(#purple-arrow)"/>
  <rect x="1312" y="244" width="120" height="38" rx="10" fill="#F1E7F2" stroke="#BE92C0" stroke-width="1.5"/>
  <text x="1372" y="270" text-anchor="middle" class="small" font-weight="700" fill="#633368">LightGBM</text>

  <!-- Heterogeneous graph branch. -->
  <rect x="810" y="336" width="645" height="218" rx="17" fill="#F7FBF8" stroke="#9BC7A9" stroke-width="2"/>
  <rect x="833" y="359" width="42" height="42" rx="10" fill="#43855C"/>
  <text x="854" y="388" text-anchor="middle" font-size="23" font-weight="700" fill="#FFFFFF">2</text>
  <text x="892" y="389" class="section" fill="#2F6C45">APK 异构图构建</text>
  <text x="1429" y="386" text-anchor="end" class="small" fill="#4A8060">输出：异构程序图</text>
  <path d="M833 413 H1432" stroke="#D8E9DD" stroke-width="1.5"/>
  <text x="835" y="443" class="body" fill="#30443A">节点：应用、类、方法、API、权限、组件等</text>
  <text x="835" y="473" class="body" fill="#30443A">关系：声明、定义、调用、使用、归属等</text>
  <rect x="835" y="498" width="234" height="38" rx="10" fill="#FFFFFF" stroke="#91C2A1" stroke-width="1.5"/>
  <text x="952" y="524" text-anchor="middle" class="small" fill="#2F6C45">实体与关系抽取</text>
  <path d="M1075 517 H1111" stroke="#4A8060" stroke-width="2" marker-end="url(#green-arrow)"/>
  <rect x="1119" y="498" width="143" height="38" rx="10" fill="#FFFFFF" stroke="#91C2A1" stroke-width="1.5"/>
  <text x="1190" y="524" text-anchor="middle" class="small" fill="#2F6C45">类型化图表示</text>
  <path d="M1268 517 H1304" stroke="#4A8060" stroke-width="2" marker-end="url(#green-arrow)"/>
  <rect x="1312" y="498" width="120" height="38" rx="10" fill="#E7F2E9" stroke="#91C2A1" stroke-width="1.5"/>
  <text x="1372" y="524" text-anchor="middle" class="small" font-weight="700" fill="#2F6C45">GATv2 分支</text>

  <text x="47" y="597" class="tiny" fill="#687C86">注：图中“静态解析”是概念层面的共同步骤；实现中静态特征脚本与构图脚本分别调用 Androguard。</text>
</svg>
